<ce-form-block-core-prop-edit [context]="context"
    (blockChanges)="onCoreBlockChange($event)"></ce-form-block-core-prop-edit>

    <form [formGroup]="formGroup">

        <ce-column gap="12px">
    
            <mat-form-field>
                <mat-label>Root</mat-label>
                <input #rootInput matInput (click)="onOpenSelection()" formControlName="root" readonly="true">
                @if (rootInput.value) {
                <button matSuffix mat-icon-button aria-label="Clear" (click)="onClearSelection()">
                    <mat-icon>close</mat-icon>
                </button>
                }
            </mat-form-field>
    
            <mat-form-field>
                <mat-label>Index</mat-label>
                <input #indexInput matInput (click)="onOpenIndex()" formControlName="index" readonly="true">
                @if (indexInput.value) {
                    <button matSuffix mat-icon-button aria-label="Clear" (click)="onClearIndex()">
                        <mat-icon>close</mat-icon>
                    </button>
                    }
            </mat-form-field>
    
            <mat-form-field>
                <mat-label>Target</mat-label>
                <input #targetInput matInput (click)="onOpenTarget()" formControlName="target" readonly="true">
                @if (targetInput.value) {
                    <button matSuffix mat-icon-button aria-label="Clear" (click)="onClearTarget()">
                        <mat-icon>close</mat-icon>
                    </button>
                    }
            </mat-form-field>

        </ce-column>
    
    </form>
