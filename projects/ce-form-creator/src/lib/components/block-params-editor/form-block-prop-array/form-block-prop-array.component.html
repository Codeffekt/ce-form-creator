<ce-form-block-core-prop-edit [context]="context"
    (blockChanges)="onCoreBlockChange($event)"></ce-form-block-core-prop-edit>

<ce-form-block-prop-fields [context]="context" (blockChanges)="onCoreBlockChange($event)"></ce-form-block-prop-fields>

<form [formGroup]="formGroup">

    <ce-column gap="12px">

        <mat-form-field [dndDropzone]="dndFormService.indexAllowedTypes" (dndDrop)="onDropElement($event)">
            <mat-label>Root</mat-label>
            <input #rootInput matInput (click)="onOpenSelection()" formControlName="root" readonly="true">
            @if (rootInput.value) {
                <button matSuffix mat-icon-button aria-label="Clear" (click)="onClear()">
                    <mat-icon>close</mat-icon>
                </button>
                }
        </mat-form-field>

        <ce-row gap="12px" cePadding="0px 0px 20px 0px">
            <span>Utiliser la catégorie</span>
            <mat-checkbox formControlName="useCategory"></mat-checkbox>
        </ce-row>

        <mat-form-field>
            <mat-label>Index</mat-label>
            <input matInput (click)="onOpenIndex()" formControlName="index" readonly="true">
        </mat-form-field>

    </ce-column>

</form>
