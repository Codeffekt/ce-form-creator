<ce-panel-section>
    <ce-panel-section-label>Paramètres du formulaire</ce-panel-section-label>
    <ce-panel-section-content>
        <form [formGroup]="formGroup">
            <ce-column cePaddingY="8px" gap="12px">
                <mat-form-field>
                    <mat-label>Identifiant</mat-label>
                    <input matInput formControlName="id">
                </mat-form-field>

                <mat-form-field [dndDropzone]="dndFormService.indexAllowedTypes" (dndDrop)="onDropElement($event)">
                    <mat-label>Catégorie</mat-label>
                    <input #catInput matInput (click)="onOpenSelection()" formControlName="cat" readonly="true">
                    @if (catInput.value) {
                    <button matSuffix mat-icon-button aria-label="Clear" (click)="onClear()">
                        <mat-icon>close</mat-icon>
                    </button>
                    }
                </mat-form-field>

                <mat-form-field>
                    <mat-label>Titre</mat-label>
                    <input matInput formControlName="title">
                </mat-form-field>

                <mat-form-field>
                    <mat-label>Version</mat-label>
                    <input matInput formControlName="version">
                </mat-form-field>
            </ce-column>
        </form>

        <ce-form-prop-fields [root]="form.form" (rootChanges)="onFormParamsChanges($event)"></ce-form-prop-fields>

    </ce-panel-section-content>
</ce-panel-section>
