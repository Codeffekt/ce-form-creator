<form [formGroup]="formGroup">

    <ce-column gap="12px">

        <mat-form-field>
            <mat-label>Point d'entrée</mat-label>
            <input #entryInput matInput (click)="onOpenSelection()" formControlName="entryPoint" readonly="true">
            @if (entryInput.value) {
            <button matSuffix mat-icon-button aria-label="Clear" (click)="onClearSelection()">
                <mat-icon>close</mat-icon>
            </button>
            }
        </mat-form-field>

    </ce-column>

</form>
